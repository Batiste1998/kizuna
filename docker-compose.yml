services:
  postgres:
    image: postgres:17-alpine
    container_name: kizuna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kizuna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kizuna}
      POSTGRES_DB: ${POSTGRES_DB:-kizuna}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kizuna-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kizuna} -d ${POSTGRES_DB:-kizuna}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:5
    container_name: kizuna-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  kizuna-pgdata:
