services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kizuna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kizuna}
      POSTGRES_DB: ${POSTGRES_DB:-kizuna}
    volumes:
      - kizuna-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-kizuna} -d ${POSTGRES_DB:-kizuna}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-kizuna}:${POSTGRES_PASSWORD:-kizuna}@postgres:5432/${POSTGRES_DB:-kizuna}
      API_PORT: '3001'
      CORS_ORIGINS: ${WEB_PUBLIC_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${API_PUBLIC_URL:-http://localhost:3001}
      UPLOAD_DIR: /data/uploads
      # Emails transactionnels (liens construits avec WEB_PUBLIC_URL ;
      # sans SMTP_HOST, les emails sont simulés dans les logs).
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:3000}
      MAIL_FROM: ${MAIL_FROM:-Kizuna <no-reply@kizuna.dev>}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    volumes:
      - kizuna-uploads:/data/uploads
    ports:
      - '${API_PORT:-3001}:3001'
    healthcheck:
      # L'image node:22-slim n'a ni curl ni wget : on sonde /health avec fetch.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${API_PUBLIC_URL:-http://localhost:3001}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Supervision : sondes HTTP + alertes (email/webhook) configurées dans l'UI.
  # Accessible uniquement en local sur le serveur (tunnel SSH) :
  #   ssh -L 3002:127.0.0.1:3002 kizuna  →  http://localhost:3002
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes:
      - kizuna-uptime-kuma:/app/data
    ports:
      - '127.0.0.1:3002:3001'

volumes:
  kizuna-pgdata:
  kizuna-uploads:
  kizuna-uptime-kuma:
