# Mise à jour automatisée des dépendances (RNCP39583 — C4.1.1).
# Politique détaillée : docs/MAINTENANCE.md
version: 2
updates:
  # Dépendances npm de tout le monorepo (pnpm workspaces)
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    groups:
      # Les patchs et mineures sont regroupés en une seule PR hebdomadaire ;
      # les majeures restent des PR individuelles (revue manuelle).
      minor-et-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
    commit-message:
      prefix: 'chore(deps)'

  # Actions GitHub utilisées par les workflows CI/CD
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: 'chore(ci)'
