<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @keyframes notifPop{from{transform:translateY(-6px) scale(.985)}to{transform:none}}
</style>
</helmet>
<div style="position:relative;display:inline-flex">
  <button onClick="{{ toggle }}" title="Notifications" style="{{ btnStyle }}" style-hover="background:#F4F4F0">
    <span style="display:flex">{{ bellIcon }}</span>
    <sc-if value="{{ hasUnread }}" hint-placeholder-val="{{ true }}"><span style="{{ badgeStyle }}">{{ unreadLabel }}</span></sc-if>
  </button>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ close }}" style="position:fixed;inset:0;z-index:80;background:transparent"></div>
    <div style="position:absolute;top:48px;right:0;width:372px;max-width:90vw;background:#fff;border:1px solid #E4E4DE;border-radius:15px;box-shadow:0 22px 60px rgba(0,0,0,.20);z-index:90;overflow:hidden;animation:notifPop .14s ease-out">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px 13px;border-bottom:1px solid #F0F0EC">
        <div style="display:flex;align-items:center;gap:9px"><span style="font-size:14.5px;font-weight:700;letter-spacing:-.01em">Notifications</span><sc-if value="{{ hasUnread }}" hint-placeholder-val="{{ true }}"><span style="font-size:11px;font-weight:700;background:{{ accentSoft }};color:{{ accentStrong }};padding:1px 8px;border-radius:999px">{{ unreadLabel }}</span></sc-if></div>
        <sc-if value="{{ hasUnread }}" hint-placeholder-val="{{ true }}"><button onClick="{{ markAll }}" style="font-size:12px;font-weight:600;color:{{ accent }};background:none;border:none;cursor:pointer;padding:2px 4px">Tout marquer comme lu</button></sc-if>
      </div>
      <div style="max-height:62vh;overflow-y:auto">
        <sc-for list="{{ items }}" as="it" hint-placeholder-count="3">
          <a href="{{ it.href }}" onClick="{{ it.onClick }}" style="{{ it.rowStyle }}" style-hover="background:#F7F7F4">
            <span style="width:36px;height:36px;border-radius:9px;background:{{ it.iconBg }};color:{{ it.iconColor }};display:flex;align-items:center;justify-content:center;flex:none">{{ it.icon }}</span>
            <span style="flex:1;min-width:0">
              <span style="display:flex;align-items:center;gap:8px"><span style="font-size:13.5px;font-weight:600;color:#1B1B19;line-height:1.3;flex:1;min-width:0">{{ it.title }}</span><sc-if value="{{ it.unread }}" hint-placeholder-val="{{ false }}"><span style="width:7px;height:7px;border-radius:50%;background:{{ accent }};flex:none;margin-top:2px"></span></sc-if></span>
              <span style="display:block;font-size:12.5px;color:#76766F;line-height:1.4;margin-top:2px">{{ it.detail }}</span>
              <span style="display:block;font-size:11px;color:#A8A89F;margin-top:4px">{{ it.time }}</span>
            </span>
          </a>
        </sc-for>
        <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
          <div style="padding:36px 20px;text-align:center"><div style="font-size:13.5px;font-weight:600;color:#44443F">Tout est à jour</div><div style="font-size:12.5px;color:#9A9A93;margin-top:4px">Aucune notification en attente.</div></div>
        </sc-if>
      </div>
      <a href="{{ allHref }}" style="display:flex;align-items:center;justify-content:center;gap:6px;padding:11px;border-top:1px solid #F0F0EC;font-size:12.5px;font-weight:600;color:#5B5B55;background:#FCFCFB;cursor:pointer" style-hover="background:#F4F4F0">Voir toute l'activité</a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 372, &quot;height&quot;: 460 },
  &quot;items&quot;: { &quot;editor&quot;: null, &quot;tsType&quot;: &quot;Array&lt;{id:string,type:string,title:string,detail:string,time:string,href:string,unread:boolean}&gt;&quot; },
  &quot;accent&quot;: { &quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#6B5BD2&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;accentSoft&quot;: { &quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#ECE9FB&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;accentStrong&quot;: { &quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#4F40B0&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;allHref&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;#&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;defaultOpen&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot; }
}">
class Component extends DCLogic {
  state = { open: false, readIds: [] };

  componentDidMount() { if (this.props.defaultOpen === true) this.setState({ open: true }); }

  typeMeta = {
    bilan:      { iconBg: '#F7EFDA', iconColor: '#9A6B12', icon: 'calendar' },
    competence: { iconBg: '#E8EEF7', iconColor: '#3D5E8E', icon: 'target' },
    message:    { iconBg: '__ACCENT_SOFT__', iconColor: '__ACCENT__', icon: 'chat' },
    validation: { iconBg: '#E4F2EC', iconColor: '#1F7A63', icon: 'check' },
    journal:    { iconBg: '#E4F2EC', iconColor: '#1F7A63', icon: 'fileText' },
    user:       { iconBg: '#EEE7F5', iconColor: '#6B4E96', icon: 'userPlus' },
    ticket:     { iconBg: '#FBEAE1', iconColor: '#B5572F', icon: 'lifebuoy' },
    school:     { iconBg: '#E8EEF7', iconColor: '#3D5E8E', icon: 'building' }
  };

  toggle() { this.setState(s => ({ open: !s.open })); }
  close() { this.setState({ open: false }); }
  markRead(id) { this.setState(s => (s.readIds.includes(id) ? null : { readIds: [...s.readIds, id] })); }
  markAll() { const ids = (this.props.items || []).map(i => i.id); this.setState({ readIds: ids }); }

  renderVals() {
    const icons = this.buildIcons();
    const accent = this.props.accent || '#6B5BD2';
    const accentSoft = this.props.accentSoft || '#ECE9FB';
    const accentStrong = this.props.accentStrong || accent;
    const raw = Array.isArray(this.props.items) ? this.props.items : [];

    const items = raw.map((it, idx) => {
      const id = it.id != null ? it.id : 'n' + idx;
      const tm = this.typeMeta[it.type] || this.typeMeta.message;
      const unread = !!it.unread && !this.state.readIds.includes(id);
      const iconBg = tm.iconBg === '__ACCENT_SOFT__' ? accentSoft : tm.iconBg;
      const iconColor = tm.iconColor === '__ACCENT__' ? accent : tm.iconColor;
      const href = it.href || '#';
      return {
        title: it.title, detail: it.detail || '', time: it.time || '', icon: icons[tm.icon], iconBg, iconColor, unread, href,
        rowStyle: `display:flex;gap:11px;align-items:flex-start;padding:12px 15px;border-bottom:1px solid #F2F2EE;cursor:pointer;text-decoration:none;background:${unread ? '#FCFCFB' : '#fff'}`,
        onClick: (e) => { if (href === '#') e.preventDefault(); this.markRead(id); }
      };
    });

    const unreadCount = items.filter(i => i.unread).length;

    return {
      icons, accent, accentSoft, accentStrong,
      open: this.state.open, toggle: () => this.toggle(), close: () => this.close(),
      bellIcon: icons.bell,
      btnStyle: 'position:relative;width:38px;height:38px;border-radius:10px;border:1px solid #ECECE7;background:#fff;color:#6E6E68;display:flex;align-items:center;justify-content:center;cursor:pointer',
      hasUnread: unreadCount > 0, unreadLabel: unreadCount > 9 ? '9+' : String(unreadCount),
      badgeStyle: `position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:${accent};color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff`,
      items, isEmpty: items.length === 0, markAll: () => this.markAll(),
      allHref: this.props.allHref || '#'
    };
  }

  svg(parts, size) { return React.createElement('svg', { width: size || 18, height: size || 18, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.7, strokeLinecap: 'round', strokeLinejoin: 'round' }, parts.map((p, i) => React.createElement(p[0], Object.assign({ key: i }, p[1])))); }
  buildIcons() {
    const S = (a, b) => this.svg(a, b);
    return {
      bell: S([['path', { d: 'M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9' }], ['path', { d: 'M10.3 21a1.94 1.94 0 0 0 3.4 0' }]], 18),
      calendar: S([['rect', { x: 3, y: 4, width: 18, height: 18, rx: 2 }], ['path', { d: 'M16 2v4' }], ['path', { d: 'M8 2v4' }], ['path', { d: 'M3 10h18' }]], 17),
      target: S([['circle', { cx: 12, cy: 12, r: 10 }], ['circle', { cx: 12, cy: 12, r: 6 }], ['circle', { cx: 12, cy: 12, r: 2 }]], 17),
      chat: S([['path', { d: 'M7.9 20A9 9 0 1 0 4 16.1L2 22Z' }]], 17),
      check: S([['path', { d: 'M21.801 10A10 10 0 1 1 17 3.335' }], ['path', { d: 'm9 11 3 3L22 4' }]], 17),
      fileText: S([['path', { d: 'M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z' }], ['path', { d: 'M14 2v5h5' }], ['path', { d: 'M16 13H8' }], ['path', { d: 'M16 17H8' }], ['path', { d: 'M10 9H8' }]], 16),
      userPlus: S([['path', { d: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2' }], ['circle', { cx: 9, cy: 7, r: 4 }], ['line', { x1: 19, x2: 19, y1: 8, y2: 14 }], ['line', { x1: 22, x2: 16, y1: 11, y2: 11 }]], 16),
      lifebuoy: S([['circle', { cx: 12, cy: 12, r: 10 }], ['path', { d: 'm4.93 4.93 4.24 4.24' }], ['path', { d: 'm14.83 9.17 4.24-4.24' }], ['path', { d: 'm14.83 14.83 4.24 4.24' }], ['path', { d: 'm9.17 14.83-4.24 4.24' }], ['circle', { cx: 12, cy: 12, r: 4 }]], 17),
      building: S([['rect', { x: 4, y: 2, width: 16, height: 20, rx: 2 }], ['path', { d: 'M9 22v-4h6v4' }], ['path', { d: 'M8 6h.01' }], ['path', { d: 'M16 6h.01' }], ['path', { d: 'M12 6h.01' }], ['path', { d: 'M12 10h.01' }], ['path', { d: 'M8 10h.01' }], ['path', { d: 'M16 10h.01' }]], 16)
    };
  }
}
</script>
</body>
</html>
